<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; media-src data:" />
    <title>Teach Me</title>
    <style>
      :root {
        --bg: #0f1113; --panel: #16181b; --card: #1c1f24; --line: #2a2e33;
        --text: #e6e6e6; --muted: #9aa1a9; --accent: #3b82f6; --accent-soft: #1e3a5f;
        --good: #22c55e; --bad: #ef4444; --warn: #f59e0b;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text);
             font-family: -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
      button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
               background: var(--card); color: var(--text); padding: 8px 14px; }
      button:hover { border-color: #3d434a; }
      button.primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
      button.primary:disabled { opacity: .5; cursor: default; }
      button.link { background: none; border: none; color: #8ebcff; padding: 0; }
      .hidden { display: none !important; }
      .muted { color: var(--muted); }
      .error { color: #fca5a5; }

      /* ---- home ---- */
      .interview { margin-bottom: 8px; }
      .iv-answers { border-left: 2px solid var(--line); padding: 2px 0 2px 14px; margin-bottom: 14px; }
      .iv-answer { display: flex; align-items: baseline; gap: 10px; padding: 4px 0; font-size: 14px; }
      .iv-a-label { color: var(--muted); width: 92px; flex: none; }
      .iv-a-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .iv-answer .link { font-size: 13px; }
      .iv-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 22px 18px; }
      .iv-step { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
      .iv-q { font-size: 22px; margin: 6px 0 4px; }
      .iv-help { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
      .iv-input { width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--line);
                  border-radius: 8px; padding: 11px 13px; font: inherit; font-size: 16px; margin-top: 6px; }
      textarea.iv-input { resize: vertical; font-size: 15px; line-height: 1.45; }
      .iv-input:focus { outline: none; border-color: var(--accent); }
      .iv-sub { margin-top: 14px; }
      .iv-sub-label { font-size: 13px; color: var(--muted); }
      .iv-sub .files-row { display: flex; align-items: center; gap: 10px; }
      .iv-card .fine { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.45; }
      .iv-card .choices { margin-top: 6px; }
      .iv-nav { display: flex; align-items: center; justify-content: flex-end; gap: 14px; margin-top: 18px; }
      .iv-nav .primary { padding: 10px 24px; }
      .iv-card .error { margin-top: 10px; }
      #home { max-width: 860px; margin: 0 auto; padding: 56px 24px 40px; }
      #home h1 { font-size: 34px; margin: 0 0 6px; }
      #home .tagline { color: var(--muted); margin: 0 0 28px; }
      .prompt { display: flex; align-items: center; gap: 10px; background: var(--card);
                border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 18px; }
      .prompt span { color: var(--muted); font-size: 18px; white-space: nowrap; }
      .sources-box { margin-top: 10px; }
      .sources-box summary { cursor: pointer; color: var(--muted); font-size: 14px; }
      .sources-box textarea { width: 100%; margin-top: 8px; background: var(--card); color: var(--text);
                              border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
                              font: 14px Consolas, monospace; resize: vertical; }
      .sources-box .files-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      .sources-box .files-row button { padding: 6px 12px; font-size: 13px; }
      .source-files { list-style: none; padding: 0; margin: 6px 0 0; font-size: 13px; }
      .source-files li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
      .source-files li button { padding: 0 6px; font-size: 12px; line-height: 18px; }
      .sources-box .fine { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.45; }
      .prompt input { flex: 1; min-width: 0; background: none; border: none; outline: none;
                      color: var(--text); font-size: 18px; padding: 12px 0; }
      .choice-label { margin: 24px 0 10px; font-weight: 600; }
      .choices { display: grid; gap: 10px; }
      .choices.levels { grid-template-columns: repeat(5, 1fr); }
      .choice.quiz-me { border-style: dashed; border-color: #4b5563; }
      .choice.quiz-me.selected { border-style: solid; border-color: var(--accent); }
      .choices.modes { grid-template-columns: repeat(3, 1fr); }
      label.choice-label { display: block; }
      .lang-hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
      input.language { display: block; min-width: 260px; background: var(--card); color: var(--text);
                        border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; }
      .choice { text-align: left; padding: 12px 14px; background: var(--card); }
      .choice b { display: block; margin-bottom: 4px; }
      .choice small { color: var(--muted); line-height: 1.35; display: block; }
      .choice.selected { border-color: var(--accent); background: var(--accent-soft); }
      .start-row { display: flex; align-items: center; gap: 14px; margin-top: 24px; }
      .start-row button { padding: 12px 28px; font-size: 16px; }
      #courses-head { margin: 48px 0 12px; font-size: 18px; }
      .course-card { display: flex; align-items: center; gap: 16px; padding: 14px 16px; margin-bottom: 10px;
                     background: var(--card); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
      .course-card:hover { border-color: #3d434a; }
      .course-card .info { flex: 1; min-width: 0; }
      .course-card .title { font-weight: 600; margin-bottom: 4px; }
      .course-card .meta { color: var(--muted); font-size: 13px; }
      .course-card .delete { font-size: 12px; padding: 4px 10px; color: var(--muted); background: none; white-space: nowrap; }
      .course-card .delete:hover { color: #fecaca; border-color: var(--bad); }
      .course-card .delete.armed { color: #fff; background: var(--bad); border-color: var(--bad); }
      .bar { width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
      .bar > div { height: 100%; background: var(--good); }
      .count { width: 56px; text-align: right; color: var(--muted); font-size: 13px; }
      .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--line); margin-left: 6px; }
      .badge.building { background: var(--accent-soft); color: #bfdbfe; }
      .badge.failed { background: #4c1d1d; color: #fecaca; }

      /* ---- placement quiz ---- */
      #placement { max-width: 760px; margin: 0 auto; padding: 32px 24px 60px; }
      #placement h1 { font-size: 26px; margin: 18px 0 6px; }
      .p-meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 14px 0 4px; }
      .p-meter > div { height: 100%; background: var(--accent); transition: width .3s; }
      .answer.idk { color: var(--muted); border-style: dashed; margin-top: 14px; }
      .level-row { display: grid; grid-template-columns: 170px 1fr 70px; align-items: center; gap: 14px; margin: 10px 0; }
      .level-row .bar { width: auto; }
      .level-row .bar > div.miss { background: var(--warn); }
      .level-row .n { color: var(--muted); font-size: 13px; text-align: right; }
      .concepts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
      .concepts span { font-size: 13px; padding: 4px 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
      .concepts.gaps span { border-color: #7c5a12; background: #2a2210; color: #fde68a; }
      .review { margin: 14px 0; }
      .review summary { cursor: pointer; color: var(--muted); }
      .review .item { border-left: 3px solid var(--warn); padding: 4px 0 4px 12px; margin: 14px 0; line-height: 1.5; }
      .review .item .q { font-weight: 600; }
      .choices.small { grid-template-columns: repeat(4, 1fr); }
      .choice .tag { font-size: 11px; color: #bfdbfe; text-transform: uppercase; letter-spacing: .05em; }

      /* ---- course ---- */
      #course { display: flex; height: 100vh; }
      aside { width: 290px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
              display: flex; flex-direction: column; }
      aside .top { padding: 16px; border-bottom: 1px solid var(--line); }
      aside h2 { font-size: 17px; margin: 12px 0 4px; line-height: 1.3; }
      aside .sub { color: var(--muted); font-size: 13px; }
      aside .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--muted); }
      aside .progress-row .bar { flex: 1; }
      #nav { overflow-y: auto; flex: 1; padding: 8px; }
      .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none;
                  background: none; padding: 10px; border-radius: 8px; color: var(--text); }
      .nav-item:hover { background: var(--card); }
      .nav-item.active { background: var(--accent-soft); }
      .nav-item .mark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #3d434a; flex-shrink: 0;
                        display: flex; align-items: center; justify-content: center; font-size: 13px; }
      .nav-item .mark.done { background: var(--good); border-color: var(--good); color: #052e12; font-weight: 700; }
      .nav-item .mark.wait { border-style: dashed; animation: spin 2s linear infinite; }
      .nav-item .mark.warn { border-color: var(--warn); color: var(--warn); }
      .nav-item .label { flex: 1; min-width: 0; font-size: 14px; line-height: 1.3; }
      .nav-item .label small { color: var(--muted); display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }
      main { flex: 1; overflow-y: auto; }
      #build-panel { margin: 20px 40px 0; padding: 14px 16px; border: 1px solid var(--accent-soft); background: #111a26;
                     border-radius: 10px; }
      #build-panel .now { font-weight: 600; }
      #build-log { margin-top: 8px; max-height: 120px; overflow-y: auto; font-size: 12px; color: var(--muted);
                   font-family: Consolas, monospace; white-space: pre-wrap; }
      #content { max-width: 860px; margin: 0 auto; padding: 28px 40px 80px; }
      .day-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      .day-head h1 { margin: 0 0 6px; font-size: 26px; }
      .day-head .kicker { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
      .complete-btn.done { background: #0f2e1b; border-color: var(--good); color: #bbf7d0; }
      .tabs { display: flex; gap: 6px; margin: 22px 0 8px; border-bottom: 1px solid var(--line); }
      .tabs button { border: none; background: none; border-bottom: 2px solid transparent; border-radius: 0;
                     padding: 10px 14px; color: var(--muted); }
      .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
      .md { line-height: 1.65; }
      .md h1, .md h2, .md h3 { line-height: 1.3; margin-top: 1.6em; }
      .md a { color: #8ebcff; }
      .md code { background: var(--card); padding: 1px 5px; border-radius: 4px; }
      .md pre { background: var(--card); padding: 12px; border-radius: 8px; overflow-x: auto; }
      .md blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: 14px; color: var(--muted); }
      .md table { border-collapse: collapse; } .md td, .md th { border: 1px solid var(--line); padding: 6px 10px; }
      .md img { display: block; max-width: 100%; margin: 20px auto 6px; border-radius: 10px; background: white; }
      .md img + em, .md p:has(> img) + p > em:only-child { display: block; text-align: center; color: var(--muted); }
      .figure-caption { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 18px; }
      .video { margin: 18px 0 28px; }
      .video .frame { position: relative; aspect-ratio: 16/9; background: black; border-radius: 10px; overflow: hidden; }
      .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .video h3 { margin: 12px 0 4px; font-size: 16px; }
      .video .why { margin: 6px 0; line-height: 1.5; }
      .video .clip { margin: 10px 0 14px; }
      .video .clip-label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
      .quiz-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 16px; }
      .quiz-card .qnum { color: var(--muted); font-size: 13px; }
      .quiz-card h3 { margin: 6px 0 16px; line-height: 1.4; }
      .answer { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 12px 14px; }
      .answer.right { border-color: var(--good); background: #0f2e1b; }
      .answer.wrong { border-color: var(--bad); background: #3b1414; }
      .explain { margin: 12px 0; line-height: 1.5; }
      .score { font-size: 28px; font-weight: 700; margin: 6px 0; }
      .empty { color: var(--muted); padding: 20px 0; }
      .error-box { border: 1px solid #7f1d1d; background: #2a1212; padding: 10px 14px; border-radius: 8px; margin: 14px 0;
                   font-size: 13px; color: #fecaca; white-space: pre-wrap; overflow-wrap: anywhere; }
      .note-box { border: 1px solid #3b4a63; background: #131c2a; padding: 10px 14px; border-radius: 8px; margin: 14px 0;
                  font-size: 13px; color: #c7d7f0; line-height: 1.5; }
      .checked { margin: 4px 0 18px; font-size: 13px; }
      .checked summary { cursor: pointer; color: var(--muted); }
      .checked li { margin: 8px 0; line-height: 1.4; }
      .walkthrough { margin: 18px 0 28px; }
      .walkthrough .kicker { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
      .walkthrough h2 { margin: 4px 0 12px; font-size: 20px; }
      .walkthrough .screen { aspect-ratio: 16/9; background: #f4f4f2; border-radius: 10px; overflow: hidden;
                             display: flex; align-items: center; justify-content: center; }
      .scene-img { width: 100%; height: 100%; object-fit: contain; opacity: 0; transform: scale(1.02);
                   transition: opacity .45s ease, transform 4s ease-out; }
      .scene-img.shown { opacity: 1; transform: scale(1); }
      .walkthrough .controls { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
      .walkthrough .controls .voice { margin-left: auto; font-size: 13px; display: flex; align-items: center; gap: 6px; }
      .walkthrough .dots { display: flex; gap: 6px; margin: 12px 0 4px; }
      .walkthrough .dot { width: 26px; height: 6px; padding: 0; border-radius: 3px; border: none; background: var(--line); }
      .walkthrough .dot.on { background: var(--accent); }
      .walkthrough h3 { margin: 12px 0 6px; font-size: 17px; }
      .walkthrough .narration { line-height: 1.6; margin: 0; color: #d4d7db; }
      .retry { width: 100%; margin-top: 12px; border-color: var(--warn); color: #fde68a; background: #2a2210; }
      .pdf-btn { width: 100%; margin-top: 10px; }
      .pdf-box { margin-top: 10px; padding: 10px 12px; border: 1px solid #3b4a63; background: #131c2a; border-radius: 8px;
                 font-size: 13px; color: #c7d7f0; line-height: 1.5; }
      .pdf-box input { width: 100%; box-sizing: border-box; margin: 8px 0; padding: 6px 8px; font-size: 13px; }
      .pdf-box .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
      .pdf-box .error { color: #fecaca; }

      .modal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center;
                    justify-content: center; z-index: 50; padding: 16px; }
      .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; max-width: 560px;
               width: 100%; max-height: 90vh; overflow: auto; padding: 22px 24px; line-height: 1.55; }
      .modal h2 { margin: 0 0 8px; font-size: 20px; }
      .modal ol { padding-left: 20px; margin: 12px 0; }
      .modal li { margin: 8px 0; }
      .modal .key-row { display: flex; gap: 8px; margin-top: 8px; }
      .modal .key-row input { flex: 1; padding: 7px 9px; font-size: 14px; min-width: 0; }
      .modal code { background: var(--card); padding: 1px 6px; border-radius: 4px; }
      .modal .fine { font-size: 12.5px; color: var(--muted); }
      .modal .found { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
      .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
      .modal .ok { color: var(--good); }
      .modal .error { color: #fecaca; }
      #ai-setup { margin-left: 8px; font-size: 13px; }
      @media (max-width: 900px) {
        .choices.levels, .choices.small { grid-template-columns: repeat(2, 1fr); }
        .level-row { grid-template-columns: 120px 1fr 50px; }
        .choices.modes { grid-template-columns: 1fr; }
        aside { width: 230px; }
        #content { padding: 24px 20px 60px; }
      }
      /* Phones (the web site): sidebar on top, day list scrolls sideways, page scrolls as a whole. */
      @media (max-width: 640px) {
        #home { padding: 28px 16px 32px; }
        #home h1 { font-size: 28px; }
        .prompt { flex-wrap: wrap; padding: 6px 12px; }
        .start-row { flex-wrap: wrap; }
        .course-card { flex-wrap: wrap; gap: 8px 12px; }
        .course-card .info { flex-basis: 100%; }
        .course-card .bar { flex: 1; width: auto; }
        #placement { padding: 20px 16px 40px; }
        .level-row { grid-template-columns: 1fr 44px; }
        .level-row .bar { grid-column: 1 / -1; grid-row: 2; }
        #course { flex-direction: column; height: auto; }
        aside { width: auto; border-right: none; border-bottom: 1px solid var(--line); }
        #nav { display: flex; overflow-x: auto; gap: 4px; flex: none; }
        .nav-item { flex: 0 0 auto; width: auto; max-width: 220px; }
        main { overflow: visible; }
        #build-panel { margin: 16px 16px 0; }
        #content { padding: 20px 16px 48px; }
        .day-head { flex-direction: column; }
        .walkthrough .controls { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <section id="home">
      <h1>Teach Me</h1>
      <p class="tagline">Tell me what you want to learn. I'll build you a day-by-day course.
        <button class="link" id="ai-setup" title="AI keys and local models">AI setup</button></p>
      <div id="interview" class="interview"></div>
      <datalist id="languages">
        <option value="English"></option>
        <option value="Spanish"></option>
        <option value="Chinese (Simplified)"></option>
        <option value="Hindi"></option>
        <option value="Arabic"></option>
        <option value="French"></option>
        <option value="Bengali"></option>
        <option value="Portuguese"></option>
        <option value="Russian"></option>
        <option value="Urdu"></option>
        <option value="Indonesian"></option>
        <option value="German"></option>
        <option value="Japanese"></option>
        <option value="Turkish"></option>
        <option value="Vietnamese"></option>
        <option value="Korean"></option>
        <option value="Italian"></option>
        <option value="Tamil"></option>
        <option value="Marathi"></option>
        <option value="Telugu"></option>
      </datalist>
      <h2 id="courses-head">Your courses</h2>
      <div id="course-list"><div class="empty">Loading…</div></div>
    </section>

    <section id="placement" class="hidden">
      <button class="link" id="p-back">← Back</button>
      <div id="p-content"></div>
    </section>

    <section id="course" class="hidden">
      <aside>
        <div class="top">
          <button class="link" id="back">← All courses</button>
          <h2 id="c-title"></h2>
          <div class="sub" id="c-sub"></div>
          <div class="progress-row"><div class="bar"><div id="c-bar"></div></div><span id="c-count"></span></div>
          <button id="retry" class="retry hidden" title="Builds only the parts that are missing or failed">↻ Retry failed parts</button>
          <button id="make-pdf" class="pdf-btn" title="Every day's lesson, videos, walkthrough and quiz in one PDF">Make the course into a PDF</button>
          <div id="pdf-box" class="pdf-box hidden"></div>
        </div>
        <nav id="nav"></nav>
      </aside>
      <main id="main">
        <div id="build-panel" class="hidden">
          <div class="now" id="build-now">Starting…</div>
          <div id="build-log"></div>
        </div>
        <div id="content"></div>
      </main>
    </section>

    <div id="setup" class="modal-back hidden"><div class="modal" role="dialog" aria-modal="true" id="setup-box"></div></div>

    <script src="web-api.js"></script>
    <script src="node_modules/marked/lib/marked.umd.js"></script>
    <script src="node_modules/dompurify/dist/purify.min.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
